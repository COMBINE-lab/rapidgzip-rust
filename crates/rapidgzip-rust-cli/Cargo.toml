[package]
name = "rapidgzip-rust-cli"
description = "Decode-only command-line interface for rapidgzip-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["gzip", "deflate", "parallel", "bgzf", "cli"]
categories = ["compression", "command-line-utilities"]

[[bin]]
name = "rapidgzip-rust"
path = "src/main.rs"

[features]
default = []
# Faster single-thread inflate via ISA-L (requires system/prefix libisal).
isal = ["rapidgzip-core/isal"]

[dependencies]
clap.workspace = true
rapidgzip-core.workspace = true
tempfile.workspace = true

[lints]
workspace = true
