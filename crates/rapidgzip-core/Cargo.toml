[package]
name = "rapidgzip-core"
description = "Parallel multi-member gzip and sequential zlib decoder based on the rapidgzip marker/window algorithm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/rapidgzip-core"
keywords = ["gzip", "zlib", "deflate", "parallel", "bgzf"]
categories = ["compression", "filesystem"]

[features]
default = []
# Future optional ISA-L sequential inflater. Not enabled and no `isal-sys`
# dependency is declared: many hosts lack autoreconf / system ISA-L, and
# build would fail. When wired, sequential paths already go through
# `inflate_backend::InflateBackend` (generic monomorphization; zlib-rs only today).
# isal = ["dep:isal-sys"]

[dependencies]
crossbeam-deque.workspace = true
libz-rs-sys.workspace = true
tempfile.workspace = true

[dev-dependencies]
paraseq.workspace = true
proptest.workspace = true

[lints]
workspace = true
