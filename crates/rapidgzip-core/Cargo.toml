[package]
name = "rapidgzip-core"
description = "Parallel multi-member gzip and sequential zlib decoder based on the rapidgzip marker/window algorithm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/rapidgzip-core"
keywords = ["gzip", "zlib", "deflate", "parallel", "bgzf"]
categories = ["compression", "filesystem"]

[features]
default = []
# Optional ISA-L raw-inflate backend (`IsalInflater` via `InflateBackend`).
# Requires a system or prefix-installed shared `libisal` (e.g. Ubuntu
# `libisal-dev`). Set `ISAL_INSTALL_PREFIX` to a prefix with `lib/libisal.so`
# if the library is not on the default linker path. Does **not** build ISA-L
# from source (avoids autoreconf). Default builds remain zlib-rs only.
isal = ["dep:isal-sys"]

[dependencies]
crossbeam-deque.workspace = true
libz-rs-sys.workspace = true
tempfile.workspace = true
isal-sys = { version = "0.5.3", optional = true, default-features = false, features = ["use-system-isal", "shared"] }

[dev-dependencies]
paraseq.workspace = true
proptest.workspace = true

[lints]
workspace = true
