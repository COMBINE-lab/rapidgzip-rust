[workspace]
members = [
    "crates/rapidgzip-core",
    "crates/rapidgzip-rust-cli",
    "crates/rapidgzip-bench",
]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.87"
authors = ["rapidgzip-rust contributors"]
license = "BSD-3-Clause AND MIT"
repository = "https://github.com/COMBINE-lab/rapidgzip-rust"
readme = "README.md"

[workspace.dependencies]
bon = "3.9.3"
clap = { version = "4.6.4", features = ["derive"] }
crossbeam-deque = "0.8.7"
cpu-time = "1.0.0"
criterion = "0.8.2"
libz-rs-sys = "0.6.6"
paraseq = { version = "0.4.14", default-features = false }
proptest = "1.11.0"
rapidgzip-core = { path = "crates/rapidgzip-core", version = "0.2.1" }
same-file = "1.0.6"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = 1
